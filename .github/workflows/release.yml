name: "Build release"

on:
  push:
    tags:
      - v*.*.*

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check that the tag matches the version in brutal.c
        run: |
          version=$(./scripts/mkdkmsconf.sh | sed -n 's/^PACKAGE_VERSION="\(.*\)"$/\1/p')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "brutal.c version is $version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Run build script
        run: |
          make dkms-tarball
          mkdir -p build/
          mv dkms.tar.gz build/tcp-brutal.dkms.tar.gz

      - name: Generate hashes
        run: |
          for file in build/*; do
            sha256sum $file >> build/hashes.txt
          done

      - name: Upload GitHub
        uses: softprops/action-gh-release@v1
        with:
          files: build/*

      - name: Publish to API
        env:
          HY2_API_POST_KEY: ${{ secrets.HY2_API_POST_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          code=$(echo "$version" | awk -F. '{ print $1 * 10000 + $2 * 100 + $3 }')
          curl -fsS -X POST https://api.hy2.io/v1/update \
            -H "Authorization: $HY2_API_POST_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"code\": $code, \"ver\": \"$GITHUB_REF_NAME\", \"chan\": \"tcp-brutal\", \"url\": \"https://github.com/HyNetworks/tcp-brutal/releases\", \"urgent\": false}"
